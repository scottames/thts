---
name: pr/check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: read-all
concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  trunk_check:
    name: Trunk Code Quality Runner
    runs-on: ubuntu-latest
    permissions:
      checks: write # For trunk to post annotations
      contents: read # For repo checkout
    steps:
      - name: checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: trunk check
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install mise
        # yamllint disable-line rule:line-length
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: build
        run: mise run build
      - name: unit tests
        run: mise run test
      - name: configure git for integration tests
        run: |
          git config --global user.email "ci@test.com"
          git config --global user.name "CI"
      - name: integration tests
        run: mise run test-integration
      - name: OpenCode compatibility (v1.18.29 and v2.0.6)
        run: |
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir "$temp_dir/v1" "$temp_dir/v2"
          curl --fail --location --silent --show-error \
            https://github.com/anomalyco/opencode/releases/download/v1.18.29/opencode-linux-x64.tar.gz \
            -o "$temp_dir/v1.tar.gz"
          curl --fail --location --silent --show-error \
            https://opencode.ai/files/bin/2.0.6/opencode-linux-x64.tar.gz \
            -o "$temp_dir/v2.tar.gz"
          tar -xzf "$temp_dir/v1.tar.gz" -C "$temp_dir/v1"
          tar -xzf "$temp_dir/v2.tar.gz" -C "$temp_dir/v2"
          bun scripts/verify-opencode-hosts.ts "$temp_dir/v1/opencode" "$temp_dir/v2/opencode"
