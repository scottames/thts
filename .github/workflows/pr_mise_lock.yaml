---
name: pr/mise
on:
  pull_request:
    paths:
      - mise.toml
      - mise.lock
      - .mise/locks/**
permissions: read-all
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MISE_EXPERIMENTAL: true
jobs:
  lock:
    if: "! github.event.pull_request.head.repo.fork"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # yamllint disable-line rule:line-length
      - name: Generate GitHub token
        # https://github.com/actions/create-github-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        if: "! github.event.pull_request.head.repo.fork"
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.generate-token.outputs.token }}
      - name: install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: aqua:int128/ghcp
          cache: true
          experimental: true
          github_token: ${{ steps.generate-token.outputs.token }}
      - name: mise lock
        env:
          MISE_LOCKED: 0 # disable "locked=true" for update
        run: |
          mise lock
      - name: push lockfile changes
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          # Version 1 lockfiles do not generate a sidecar directory.
          mkdir -p mise/.mise/locks
          git add --all -- mise/mise.lock mise/.mise/locks
          if git diff --cached --quiet; then
            echo "::notice ::No lockfile changes needed"
            exit 0
          fi

          # ponytail: ghcp cannot delete files; handle deletions manually.
          if ! git diff --cached --no-renames --diff-filter=D --quiet; then
            echo "::error ::ghcp cannot delete files; commit lockfile changes manually"
            exit 1
          fi

          mapfile -d '' -t files < <(git diff --cached --name-only --no-renames -z)
          ghcp commit -r "${GITHUB_REPOSITORY}" -b "${GITHUB_HEAD_REF}" \
            -m "chore(mise): lock" "${files[@]}"
          echo "::notice ::Lockfile changes pushed; checks will run on the new commit"
          exit 1
